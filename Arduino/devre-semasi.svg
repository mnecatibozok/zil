<text x="155" y="126" font-size="14" text-anchor="middle" font-weight="bold" fill="#ea580c">RF Alıcı 433 MHz (4 kanal)</text>
<text x="258" y="155" font-size="13" text-anchor="end" font-weight="normal" fill="#1f2937">CH1 A (NO)</text>
