<rect x="800" y="695" width="200" height="60" rx="6" fill="#fef2f2" stroke="#7f1d1d" stroke-width="3"/>
<text x="900" y="720" font-size="13" text-anchor="middle" font-weight="bold" fill="#7f1d1d">Anfi 220V</text>
